version: '3.8'

services:
  # Service 1: Our Node.js Web API
  web:
    build: .
    container_name: kanban-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/kanban  # 'db' matches the service name below
    depends_on:
      - db

  # Service 2: The MongoDB Database
  db:
    image: mongo:7.0
    container_name: kanban-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

# Persistent storage volume so database records survive container restarts
volumes:
  mongo-data: